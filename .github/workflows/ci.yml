name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, migrate and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: linkshort
          POSTGRES_USER: linkshort
          POSTGRES_PASSWORD: linkshort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkshort -d linkshort"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://linkshort:linkshort@localhost:5432/linkshort
      SECRET_KEY: ci-only-secret-key
      IP_HASH_PEPPER: ci-only-pepper
      BASE_URL: http://testserver
      REDIS_URL: ""

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
